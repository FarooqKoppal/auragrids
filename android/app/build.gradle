plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.lusho.auragrids"
    compileSdk = 35 // Keep this as is
    ndkVersion = flutter.ndkVersion
    compileSdkVersion flutter.compileSdkVersion

    compileOptions {
        // UPGRADE: Changed from 1_8 to 17
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        // UPGRADE: Changed from 1_8 to 17 (as a String)
        jvmTarget = "17" 
    }

    defaultConfig {
        applicationId = "com.lusho.auragrids"
        minSdk = 21
        targetSdk = 35 // UPGRADE: Match this to compileSdk
        versionCode = 1
        versionName = "1.0.0"
    }

    // Add this block if you still face JVM errors - it forces the toolchain to 17
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}