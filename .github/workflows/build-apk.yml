name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Upgraded to v4

      - name: Setup Java
        uses: actions/setup-java@v4 # Upgraded to v4
        with:
          distribution: 'zulu'
          java-version: '17' # Java 17 is perfect for Flutter 3.27.x
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true # Adding cache speeds up your build significantly
      
      - name: Get dependencies
        run: flutter pub get

      - name: Fix local.properties
        run: echo "flutter.sdk=$FLUTTER_HOME" > android/local.properties
      
      - name: Build APK (Universal)
        # Added --no-tree-shake-icons to prevent common icon-font crashes
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Build Split APKs
        # Note: We don't run 'clean' between these, or it will delete the first build
        run: flutter build apk --split-per-abi --release --no-tree-shake-icons
      
      - name: Upload APK (Universal)
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: split-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2 # Upgraded to v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_HOME" > android/local.properties